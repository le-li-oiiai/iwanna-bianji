<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Wanna Shoot · 关卡编辑器</title>
<link rel="stylesheet" href="css/editor.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div id="brand">🛠 I WANNA SHOOT · 关卡编辑器</div>
    <div id="top-actions">
      <button class="btn" id="btn-undo" title="Ctrl+Z">↶ 撤销</button>
      <button class="btn" id="btn-redo" title="Ctrl+Y">↷ 重做</button>
      <span class="sep"></span>
      <button class="btn" id="btn-fit">适应窗口</button>
      <span id="zoom-label">100%</span>
      <span class="sep"></span>
      <button class="btn primary" id="btn-test">▶ 测试游玩</button>
      <button class="btn" id="btn-export">导出 HTML</button>
      <button class="btn" id="btn-save">保存 JSON</button>
      <button class="btn" id="btn-load">加载 JSON</button>
    </div>
  </header>
  <main>
    <aside id="left">
      <div class="panel-title">工具</div>
      <div id="tools"></div>
      <div class="panel-title">吸附</div>
      <label class="row"><input type="checkbox" id="snap-toggle" checked> 网格吸附</label>
      <label class="row">网格 <input type="number" id="grid-size" min="1" max="200" step="1" value="10"></label>
      <div class="panel-title">世界设置</div>
      <label class="row">宽 <input type="number" id="world-w" min="400" max="20000" step="100"></label>
      <label class="row">高 <input type="number" id="world-h" min="200" max="3000" step="20"></label>
      <label class="row">血量上限 <input type="number" id="player-max-hp" min="1" max="99" step="1"></label>
      <label class="row">出生X <input type="number" id="spawn-x" step="1"></label>
      <label class="row">出生Y <input type="number" id="spawn-y" step="1"></label>
      <div class="panel-title">初始武器</div>
      <label class="row">武器1 <select id="weapon-1"></select></label>
      <label class="row">伤害1 <input type="number" id="weapon-dmg-1" min="1" max="99" step="1"></label>
      <label class="row">武器2 <select id="weapon-2"></select></label>
      <label class="row">伤害2 <input type="number" id="weapon-dmg-2" min="1" max="99" step="1"></label>
      <div class="hint-text" style="margin:2px 0 0">玩家最多带 2 把，按 Q 换枪、长按 Q 丢枪。</div>
    </aside>
    <div id="center">
      <canvas id="cv"></canvas>
      <div id="hint">Shift/空格+拖拽 平移 · 滚轮缩放 · 左键框选相交 · 右键框选包含</div>
    </div>
    <aside id="right">
      <div class="panel-title">属性</div>
      <div id="inspector"></div>
      <div class="panel-title">对象列表</div>
      <div id="objlist"></div>
    </aside>
  </main>
</div>
<div id="advSpikeModal" class="modal hidden">
  <div class="modal-header"><span>⚙️ 自设尖刺配置</span><button id="closeAdvModal">✕</button></div>
  <div class="modal-body" id="advSpikeBody"></div>
</div>
<div id="entityModal" class="modal hidden">
  <div class="modal-header"><span>⚙️ 实体配置</span><button id="closeEntityModal">✕</button></div>
  <div class="modal-body" id="entityBody"></div>
</div>
<div id="test-overlay" class="hidden">
  <div id="test-bar">
    <span class="ttl">▶ 测试游玩</span>
    <span class="hint">A/D 移动 · 空格跳跃(二段) · 鼠标射击 · R 重来</span>
    <button class="btn" id="btn-close-test" style="margin-left:auto">✕ 关闭</button>
  </div>
  <iframe id="test-frame"></iframe>
</div>

<!-- 导出用的游戏模板（一个字符串常量） -->
<script src="templates/game-template.js"></script>
<!-- 编辑器本体：core -> draw -> inspector -> level-io -> pointer -> main -->
<script src="js/core.js"></script>
<script src="js/draw.js"></script>
<script src="js/inspector.js"></script>
<script src="js/level-io.js"></script>
<script src="js/pointer.js"></script>
<script src="js/main.js"></script>
</body>
</html>
