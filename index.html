<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Wanna Shoot · 关卡编辑器</title>
<style>
:root{
  --bg:#0a0a12; --panel:#12121e; --panel2:#171728; --border:#26263f;
  --text:#c8d0e8; --dim:#6a7290; --accent:#5eead4; --accent2:#fde047;
  --danger:#e94560; --purple:#a78bfa; --sky:#38bdf8; --orange:#ff8c00;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;width:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:'Courier New',Consolas,monospace;font-size:13px;-webkit-font-smoothing:antialiased;}
#app{display:flex;flex-direction:column;height:100%;width:100%;}
#topbar{
  height:46px;flex:0 0 46px;display:flex;align-items:center;gap:8px;padding:0 12px;
  background:linear-gradient(180deg,#161628,#101018);
  border-bottom:1px solid var(--border);position:relative;z-index:10;
}
#brand{font-weight:bold;font-size:14px;color:var(--accent);letter-spacing:.5px;white-space:nowrap;
  text-shadow:0 0 12px rgba(94,234,212,.35);}
#top-actions{margin-left:auto;display:flex;align-items:center;gap:6px;}
.btn{
  background:var(--panel2);color:var(--text);border:1px solid var(--border);
  padding:6px 11px;border-radius:5px;cursor:pointer;font-family:inherit;font-size:12px;
  transition:.13s;white-space:nowrap;
}
.btn:hover{background:#232340;border-color:#3d3d66;color:#fff;}
.btn:active{transform:translateY(1px);}
.btn:disabled{opacity:.35;cursor:default;transform:none;}
.btn.primary{background:#12403a;border-color:#1e6b5e;color:#7dfbe1;}
.btn.primary:hover{background:#175c53;border-color:#2a9b88;color:#a7fff0;}
.sep{width:1px;height:22px;background:var(--border);margin:0 4px;}
#zoom-label{min-width:52px;text-align:center;color:var(--dim);font-size:12px;}
main{flex:1;display:flex;min-height:0;}
aside{background:var(--panel);border-right:1px solid var(--border);overflow-y:auto;}
#left{width:180px;flex:0 0 180px;padding:10px;}
#right{width:290px;flex:0 0 290px;border-right:none;border-left:1px solid var(--border);padding:10px;
  display:flex;flex-direction:column;gap:4px;overflow-y:auto;}
#center{flex:1;position:relative;overflow:hidden;background:#08080f;}
#cv{display:block;width:100%;height:100%;cursor:crosshair;}
.panel-title{
  font-size:11px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;
  margin:14px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--border);
}
.panel-title:first-child{margin-top:0;}
#tools{display:flex;flex-direction:column;gap:4px;}
.tool{
  display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:5px;cursor:pointer;
  border:1px solid transparent;color:var(--text);background:transparent;font-family:inherit;
  font-size:12px;text-align:left;transition:.12s;width:100%;
}
.tool:hover{background:#1d1d33;}
.tool.active{background:#16302e;border-color:#2a5f57;color:#7dfbe1;}
.tool .dot{width:9px;height:9px;border-radius:2px;flex:0 0 9px;}
.tool .kbd{margin-left:auto;font-size:10px;color:var(--dim);}
label.row{display:flex;align-items:center;gap:6px;margin-bottom:7px;color:var(--dim);font-size:12px;}
label.row input[type=number],label.row input[type=text]{
  width:64px;background:#0c0c16;border:1px solid var(--border);color:var(--text);
  padding:3px 5px;border-radius:4px;font-family:inherit;font-size:12px;outline:none;
}
label.row input:focus{border-color:#3d3d66;}
label.row input[type=checkbox]{accent-color:var(--accent);cursor:pointer;}
#inspector .empty{color:var(--dim);font-size:12px;line-height:1.7;padding:8px 2px;}
#inspector .empty span{font-size:11px;opacity:.7;}
.field{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.field label{flex:0 0 74px;color:var(--dim);font-size:12px;}
.field input, .field select{
  flex:1;min-width:0;background:#0c0c16;border:1px solid var(--border);color:var(--text);
  padding:4px 6px;border-radius:4px;font-family:inherit;font-size:12px;outline:none;
}
.field input:focus, .field select:focus{border-color:#3d3d66;background:#101020;}
.type-tag{
  display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:bold;
  background:#1d1d33;color:var(--accent);margin-bottom:10px;
}
.mini-btn{
  background:#141426;border:1px dashed var(--border);color:var(--dim);
  padding:4px 8px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:11px;transition:.12s;
}
.mini-btn:hover{color:var(--accent);border-color:#2a5f57;}
#objlist{flex:1;overflow-y:auto;margin:0 -4px;}
.obj-item{
  padding:4px 8px;border-radius:4px;cursor:pointer;font-size:11.5px;color:var(--dim);
  display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;
}
.obj-item:hover{background:#1b1b30;color:var(--text);}
.obj-item.sel{background:#16302e;color:#7dfbe1;}
.obj-item .dot{width:7px;height:7px;border-radius:2px;flex:0 0 7px;}
.obj-item .nm{overflow:hidden;text-overflow:ellipsis;}
#hint{
  position:absolute;left:10px;bottom:10px;color:#4a5270;font-size:11px;pointer-events:none;
  background:rgba(8,8,16,.75);padding:4px 9px;border-radius:4px;border:1px solid #1a1a2c;
}
#test-overlay{
  position:fixed;inset:0;background:rgba(4,4,10,.94);z-index:100;
  display:flex;flex-direction:column;
}
#test-overlay.hidden{display:none;}
#test-bar{
  height:42px;flex:0 0 42px;display:flex;align-items:center;gap:12px;padding:0 14px;
  background:#12121e;border-bottom:1px solid var(--border);
}
#test-bar .ttl{color:var(--accent);font-weight:bold;}
#test-bar .hint{color:var(--dim);font-size:12px;}
#test-frame{flex:1;width:100%;border:none;background:#05050c;}
.modal {
  position: fixed; top: 50px; right: 300px; width: 330px; max-height: calc(100vh - 70px);
  background: var(--panel); border: 1px solid var(--accent); border-radius: 8px;
  z-index: 50; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
}
.modal.hidden { display: none; }
.modal-header { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid var(--border); background: #1a1a2e; border-radius: 8px 8px 0 0; font-weight: bold; color: var(--accent); }
.modal-header button { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 16px; }
.modal-header button:hover { color: #fff; }
.modal-body { padding: 10px; overflow-y: auto; flex: 1; }
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#252540;border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:#343460;}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div id="brand">🛠 I WANNA SHOOT · 关卡编辑器</div>
    <div id="top-actions">
      <button class="btn" id="btn-undo" title="Ctrl+Z">↶ 撤销</button>
      <button class="btn" id="btn-redo" title="Ctrl+Y">↷ 重做</button>
      <span class="sep"></span>
      <button class="btn" id="btn-fit">适应窗口</button>

      <span class="sep"></span>
      <button class="btn primary" id="btn-test">▶ 测试游玩</button>
      <button class="btn" id="btn-export">导出 HTML</button>

    </div>
  </header>
  <main>
    <aside id="left">
      <div class="panel-title">工具</div>

      <label class="row"><input type="checkbox" id="snap-toggle" checked> 网格吸附</label>

      <div class="panel-title">世界设置</div>
      <label class="row">宽 <input type="number" id="world-w" min="400" max="20000" step="100"></label>
      <label class="row">高 <input type="number" id="world-h" min="200" max="3000" step="20"></label>

      <canvas id="cv"></canvas>

</div>
<div id="advSpikeModal" class="modal hidden">
  <div class="modal-header"><span>⚙️ 自设尖刺配置</span><button id="closeAdvModal">✕</button></div>
  <div class="modal-body" id="advSpikeBody"></div>
</div>
<div id="entityModal" class="modal hidden">
  <div class="modal-header"><span>⚙️ 实体配置</span><button id="closeEntityModal">✕</button></div>
  <div class="modal-body" id="entityBody"></div>
</div>
<div id="test-overlay" class="hidden">
  <div id="test-bar">
    <span class="ttl">▶ 测试游玩</span>
    <span class="hint">A/D 移动 · 空格跳跃(二段) · 鼠标射击 · R 重来</span>
    <button class="btn" id="btn-close-test" style="margin-left:auto">✕ 关闭</button>
  </div>
  <iframe id="test-frame"></iframe>

<script type="text/plain" id="game-template"><!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>I Wanna Shoot</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;width:100%;background:#05050c;display:flex;align-items:center;
    justify-content:center;overflow:hidden;font-family:'Courier New',monospace;}
  #wrap{position:relative;width:min(100vw,177.78vh);aspect-ratio:960/540;
    box-shadow:0 0 80px rgba(90,130,255,.25),0 0 0 1px rgba(120,150,255,.15);
    border-radius:8px;overflow:hidden;}
  canvas{display:block;width:100%;height:100%;cursor:crosshair;}
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<script>
(function(){
"use strict";
var cvs = document.getElementById('game');
var ctx = cvs.getContext('2d');
var W = 960, H = 540;
cvs.width = W; cvs.height = H;
ctx.imageSmoothingEnabled = false;
var clamp = function(v,a,b){ return v<a?a:v>b?b:v; };
var rnd = function(a,b){ return a + Math.random()*(b-a); };
var rectHit = function(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; };

/*__LEVEL_DATA__*/

var solids = staticSolids.concat(movers);
solids.forEach(function(e){
    e.ow = e.w; e.oh = e.h; e.ox = e.x; e.oy = e.y;
    if(e.hitboxes) e.hitboxes.forEach(function(h){ h._hits = 0; h._curCollide = false; });
});
adv_spikes.forEach(function(e){
    e.ow = e.w; e.oh = e.h; e.ox = e.x; e.oy = e.y;
    if(e.hitboxes) e.hitboxes.forEach(function(h){ h._hits = 0; h._curCollide = false; });
});
enemies.forEach(function(e){
    if(e.hitboxes) e.hitboxes.forEach(function(h){ h._hits = 0; h._curCollide = false; });
    if(e.hp === undefined) e.hp = 1;
    if(e.maxHp === undefined) e.maxHp = e.hp;
    if(e.damage === undefined) e.damage = 1;
});

function getHitboxRect(ent, h, t) {
    if (!h.isRelative) {
        return { x: h.x, y: h.y, w: h.w, h: h.h };
    }
    var morph = ent.morph || 'none';
    if (ent.morphDemo === false) morph = 'none';
    var ow = ent.ow !== undefined ? ent.ow : ent.w;
    var oh = ent.oh !== undefined ? ent.oh : ent.h;
    var ox = ent.ox !== undefined ? ent.ox : ent.x;
    var oy = ent.oy !== undefined ? ent.oy : ent.y;
    var cw = ow, ch = oh;
    if (morph === 'pulse') {
        var scale = 1 + Math.sin(t * 0.1) * 0.2;
        cw = ow * scale; ch = oh * scale;
    } else if (morph === 'stretch') {
        var p = (Math.sin(t * 0.05) + 1) / 2;
        cw = ow + ((ent.targetW || ow) - ow) * p;
        ch = oh + ((ent.targetH || oh) - oh) * p;
    }
    var sx = cw / ow, sy = ch / oh;
    var ecx = ent.x + ent.w / 2, ecy = ent.y + ent.h / 2;
    var ocx = ox + ow / 2, ocy = oy + oh / 2;
    var ohcx = ox + h.x + h.w / 2, ohcy = oy + h.y + h.h / 2;
    var offsetX = ohcx - ocx, offsetY = ohcy - ocy;
    var new_hcx = ecx + offsetX * sx, new_hcy = ecy + offsetY * sy;
    var new_hw = h.w * sx, new_hh = h.h * sy;
    return { x: new_hcx - new_hw / 2, y: new_hcy - new_hh / 2, w: new_hw, h: new_hh };
}

var audioCtx = null;
function initAudio(){ if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function beep(freq, dur, type, vol){
  if(!audioCtx) return;
  try{
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, audioCtx.currentTime);
    g.gain.setValueAtTime(vol || 0.02, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  }catch(e){}
}

var keys = {};
var mouse = { x: W*0.8, y: H/2, down: false };
window.addEventListener('keydown', function(e){
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.code) >= 0) e.preventDefault();
  if(!keys[e.code]){
    if(e.code==='Space' || e.code==='KeyW' || e.code==='ArrowUp') player.jumpBuffer = 8;
    if(e.code === 'KeyR' && state.mode === 'play') killPlayer();
  }
  keys[e.code] = true;
  initAudio();
});
window.addEventListener('keyup', function(e){ keys[e.code] = false; });
window.addEventListener('blur', function(){ for(var k in keys) keys[k] = false; mouse.down = false; });
cvs.addEventListener('mousemove', function(e){
  var r = cvs.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (W / r.width);
  mouse.y = (e.clientY - r.top) * (H / r.height);
});
cvs.addEventListener('mousedown', function(e){ mouse.down = true; initAudio(); e.preventDefault(); });
window.addEventListener('mouseup', function(){ mouse.down = false; });
cvs.addEventListener('contextmenu', function(e){ e.preventDefault(); });

var state = { mode: 'play', deaths: 0, camX: 0, shake: 0, deadTimer: 0, winTimer: 0, t: 0, spawn: { x: SPAWN.x, y: SPAWN.y } };
var player = { x: SPAWN.x, y: SPAWN.y, w: 14, h: 22, vx: 0, vy: 0, onGround: false, ground: null, jumpsLeft: 1, coyote: 0, jumpBuffer: 0, facing: 1, shootCd: 0, aimAngle: 0, maxHp: MAX_HP, hp: MAX_HP, invTimer: 0, slowTimer: 0, fastTimer: 0, bounceCd: 0 };
var bullets = [], enemyBullets = [], particles = [];

function updatePath(e) {
  if (!e.path || e.path.length < 2) return;
  var totalLen = 0, lens = [];
  for(var i=0; i<e.path.length-1; i++){
      var dx = e.path[i+1].x - e.path[i].x;
      var dy = e.path[i+1].y - e.path[i].y;
      var l = Math.hypot(dx, dy); lens.push(l); totalLen += l;
  }
  if(totalLen === 0) return;
  if (e.pathDist === undefined) e.pathDist = 0;
  if (e.pathDir === undefined) e.pathDir = 1;
  e.pathDist += (e.pathSpeed || 2) * e.pathDir;
  if (e.pathDist > totalLen) { e.pathDist = totalLen; e.pathDir = -1; }
  if (e.pathDist < 0) { e.pathDist = 0; e.pathDir = 1; }
  var d = e.pathDist;
  for(var i=0; i<lens.length; i++){
      if(d <= lens[i] || i === lens.length - 1){
          var t = d / lens[i]; if(t > 1) t = 1;
          var pcx = e.path[i].x + (e.path[i+1].x - e.path[i].x) * t;
          var pcy = e.path[i].y + (e.path[i+1].y - e.path[i].y) * t;
          e.x = pcx - e.w / 2;
          e.y = pcy - e.h / 2;
          break;
      }
      d -= lens[i];
  }
}

function updateMorphs() {
    var all = solids.concat(adv_spikes);
    for(var i=0; i<all.length; i++){
        var e = all[i];
        var active = true;
        if (e.hitboxes && e.hitboxes.length) {
            var hasMorphTrigger = false;
            for (var j=0; j<e.hitboxes.length; j++) {
                if (e.hitboxes[j].triggerMorph) { hasMorphTrigger = true; break; }
            }
            if (hasMorphTrigger) active = !!e._morphActivated;
        }
        var newW = e.ow, newH = e.oh;
        var offX = 0, offY = 0;
        if (active && e.morph === 'pulse') {
            var scale = 1 + Math.sin(state.t * 0.1) * 0.2;
            newW = e.ow * scale; newH = e.oh * scale;
        } else if (active && e.morph === 'stretch') {
            var p;
            if (e.morphLoop === false) {
                if (e._morphStartT === undefined) e._morphStartT = state.t;
                p = clamp((state.t - e._morphStartT) / 60, 0, 1);
            } else {
                p = (Math.sin(state.t * 0.05) + 1) / 2;
            }
            newW = e.ow + ((e.targetW || e.ow) - e.ow) * p;
            newH = e.oh + ((e.targetH || e.oh) - e.oh) * p;
            offX = (e.targetOffX || 0) * p;
            offY = (e.targetOffY || 0) * p;
        }
        var prevOffX = e._morphOffX || 0, prevOffY = e._morphOffY || 0;
        if (newW !== e.w || newH !== e.h || offX !== prevOffX || offY !== prevOffY) {
            var cx = e.x + e.w / 2, cy = e.y + e.h / 2;
            var ddx = offX - prevOffX, ddy = offY - prevOffY;
            e.w = newW; e.h = newH;
            e.x = cx + ddx - e.w / 2;
            e.y = cy + ddy - e.h / 2;
            e._morphOffX = offX; e._morphOffY = offY;
        }
    }
}

function addParticles(x, y, n, color, spd, life){
  life = life || 30;
  for(var i=0;i<n;i++){
    var a = Math.random()*Math.PI*2, s = rnd(spd*0.3, spd);
    particles.push({ x: x, y: y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 1, life: rnd(life*0.5, life), maxLife: life, color: color, size: rnd(1.5, 3.5) });
  }
}
function updateParticles(){
  for(var i=particles.length-1;i>=0;i--){
    var p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.vx *= 0.97; p.life--;
    if(p.life <= 0) particles.splice(i,1);
  }
}
function moveEntity(e, list){
  e.x += e.vx;
  for(var i=0;i<list.length;i++){
    var s = list[i]; if(s._hidden) continue;
    if(rectHit(e, s)){ if(e.vx > 0) e.x = s.x - e.w; else if(e.vx < 0) e.x = s.x + s.w; e.vx = 0; }
  }
  e.y += e.vy; e.onGround = false; e.ground = null;
  for(var j=0;j<list.length;j++){
    var t = list[j]; if(t._hidden) continue;
    if(rectHit(e, t)){
      if(e.vy >= 0){ e.y = t.y - e.h; e.vy = 0; e.onGround = true; e.ground = t; }
      else { e.y = t.y + t.h; e.vy = 0; }
    }
  }
}

/*
 * 触发时机语义（triggerCount）：
 *   0  → 需要玩家持续接触碰撞箱（离开即停止触发）
 *   1  → 玩家碰一次即永久触发（直到玩家死亡重置）
 *   N  → 累计触碰 N 次后触发（2 = 第二次触碰，3 = 第三次触碰，依此类推）
 *
 * 判定逻辑：
 *   tc === 0 时：canTrig = isCol（当前帧接触）
 *   tc >= 1 时：canTrig = _hits >= tc（累计次数）
 *
 * 对于「持续型效果」（触发运动 / 显形），tc>=1 时触发后保持，不再要求当前接触；
 * 对于「瞬时型效果」（减速 / 加速 / 弹射），仍需当前帧接触才会生效。
 */
function updateMovers(){
  for(var i=0;i<movers.length;i++){
    var m = movers[i], px = m.x, py = m.y;
    var triggerMove = false, hasMoveTrigger = false;
    if (m.hitboxes) {
      for(var j=0; j<m.hitboxes.length; j++){
        var h = m.hitboxes[j];
        if (h.triggerMove) {
          hasMoveTrigger = true;
          var hmTc = h.triggerCount || 0;
          if (hmTc === 0) {
            if (rectHit(player, getHitboxRect(m, h, state.t))) triggerMove = true;
          } else if (h._hits >= hmTc) {

function bindWorldInputs(){

  $('world-h').addEventListener('change', function(){ var v = clamp(parseInt(this.value, 10) || 540, 200, 3000); pushHistory(); level.worldH = v; this.value = v; ed.dirty = true; });
  $('player-max-hp').addEventListener('change', function(){ var v = clamp(parseInt(this.value, 10) || 3, 1, 99); pushHistory(); level.playerMaxHp = v; this.value = v; ed.dirty = true; });
  $('spawn-x').addEventListener('change', function(){ var v = parseInt(this.value, 10) || 0; pushHistory(); level.spawn.x = v; this.value = v; ed.dirty = true; });
  $('spawn-y').addEventListener('change', function(){ var v = parseInt(this.value, 10) || 0; pushHistory(); level.spawn.y = v; this.value = v; ed.dirty = true; });
  $('snap-toggle').addEventListener('change', function(){ ed.snap = this.checked; });
  $('grid-size').addEventListener('change', function(){ var v = clamp(parseInt(this.value, 10) || 10, 1, 200); ed.gridSize = v; this.value = v; ed.dirty = true; });
}

function refreshAll(){ refreshInspector(); refreshObjList(); refreshWorldInputs(); updateHistoryButtons(); ed.dirty = true; }

function serializeLevel(){
  var movers = level.movers.map(function(m){
    return { x: m.x, y: m.y, w: m.w, h: m.h, ow: m.ow !== undefined ? m.ow : m.w, oh: m.oh !== undefined ? m.oh : m.h, ox: m.ox !== undefined ? m.ox : m.x, oy: m.oy !== undefined ? m.oy : m.y, ax: m.ax, ay: m.ay, spd: m.spd, phase: m.phase || 0, dx: 0, dy: 0, path: m.path || [], pathSpeed: m.pathSpeed || 2, pathDist: 0, pathDir: 1, hitboxes: m.hitboxes || [], morph: m.morph || 'none', morphLoop: m.morphLoop !== false, targetW: m.targetW || m.w, targetH: m.targetH || m.h, targetOffX: m.targetOffX || 0, targetOffY: m.targetOffY || 0 };
  });
  var solids = level.solids.map(function(s){
    return { x: s.x, y: s.y, w: s.w, h: s.h, ow: s.ow !== undefined ? s.ow : s.w, oh: s.oh !== undefined ? s.oh : s.h, ox: s.ox !== undefined ? s.ox : s.x, oy: s.oy !== undefined ? s.oy : s.y, hitboxes: s.hitboxes || [], morph: s.morph || 'none', morphLoop: s.morphLoop !== false, targetW: s.targetW || s.w, targetH: s.targetH || s.h, targetOffX: s.targetOffX || 0, targetOffY: s.targetOffY || 0 };
  });
  var enemies = level.enemies.map(function(e){
    var baseObj = { type: e.type, x: e.x, y: e.y, w: e.w, h: e.h, alive: true, path: e.path || [], pathSpeed: e.pathSpeed || 2, pathDist: 0, pathDir: 1, hitboxes: e.hitboxes || [], hp: e.hp || 1, maxHp: e.hp || 1, damage: e.damage || 1, resetOnDeath: e.resetOnDeath !== false };
    if (e.type === 'shooter') { baseObj.baseY = e.y; baseObj.phase = e.phase || 0; baseObj.cd = e.cd || 90; }
    else if (e.type === 'walker') { baseObj.minX = e.minX; baseObj.maxX = e.maxX; baseObj.vx = e.vx; }
    return baseObj;
  });
  var adv_spikes = level.adv_spikes.map(function(s) {
    return { x: s.x, y: s.y, w: s.w, h: s.h, ow: s.ow !== undefined ? s.ow : s.w, oh: s.oh !== undefined ? s.oh : s.h, ox: s.ox !== undefined ? s.ox : s.x, oy: s.oy !== undefined ? s.oy : s.y, damage: s.damage, shape: s.shape, visibility: s.visibility, morph: s.morph || 'none', morphLoop: s.morphLoop !== false, layer: s.layer, targetW: s.targetW || s.w, targetH: s.targetH || s.h, targetOffX: s.targetOffX || 0, targetOffY: s.targetOffY || 0, hitboxes: s.hitboxes || [], phase: s.phase || 0, path: s.path || [], pathSpeed: s.pathSpeed || 2, pathDist: 0, pathDir: 1 };
  });
  var cps = level.checkpoints.map(function(c){ return { x: c.x, y: c.y, w: c.w, h: c.h, type: c.type || 'checkpoint', spawnX: c.spawnX, spawnY: c.spawnY, active: false }; });
  return { worldW: level.worldW, worldH: level.worldH, playerMaxHp: level.playerMaxHp || 3, spawn: { x: level.spawn.x, y: level.spawn.y }, solids: solids, movers: movers, spikes: level.spikes, adv_spikes: adv_spikes, enemies: enemies, checkpoints: cps, goal: level.goal || { x: 0, y: 0, w: 0, h: 0 } };
}

function generateGameHTML(){
  var lv = serializeLevel();
  var block = [
    '/* ---- 关卡数据（由编辑器生成） ---- */',
    'var WORLD_W = ' + lv.worldW + ';',
    'var WORLD_H = ' + lv.worldH + ';',
    'var MAX_HP = ' + lv.playerMaxHp + ';',
    'var SPAWN = { x: ' + lv.spawn.x + ', y: ' + lv.spawn.y + ' };',
    '',
    'var staticSolids = ' + JSON.stringify(lv.solids) + ';',
    '',
    'var movers = ' + JSON.stringify(lv.movers) + ';',
    '',
    'var spikes = ' + JSON.stringify(lv.spikes) + ';',
    '',
    'var adv_spikes = ' + JSON.stringify(lv.adv_spikes) + ';',
    '',
    'var enemies = ' + JSON.stringify(lv.enemies) + ';',
    '',
    'var checkpoints = ' + JSON.stringify(lv.checkpoints) + ';',
    '',
    'var goal = ' + JSON.stringify(lv.goal) + ';'
  ].join('\n');
  var tpl = document.getElementById('game-template').textContent;
  tpl = tpl.replace(/<\\\//g, '</');
  return tpl.replace('/*__LEVEL_DATA__*/', function(){ return block; });
}

var currentBlobUrl = null;
function testPlay(){
  try{
    var html = generateGameHTML(), blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    if(currentBlobUrl){ URL.revokeObjectURL(currentBlobUrl); }
    currentBlobUrl = URL.createObjectURL(blob);
    var iframe = $('test-frame');
    iframe.onload = function() { try { iframe.contentWindow.focus(); } catch(e) {} };
    iframe.src = currentBlobUrl;
    $('test-overlay').classList.remove('hidden');
  }catch(err){ alert('生成测试页面失败：' + err.message); }
}
function closeTest(){ $('test-overlay').classList.add('hidden'); $('test-frame').src = 'about:blank'; if(currentBlobUrl){ URL.revokeObjectURL(currentBlobUrl); currentBlobUrl = null; } }
function downloadBlob(blob, filename){ var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); document.body.removeChild(a); }, 200); }
function exportHTML(){ var html = generateGameHTML(); downloadBlob(new Blob([html], { type:'text/html;charset=utf-8' }), 'i-wanna-shoot.html'); }
function saveJSON(){ var data = JSON.stringify(serializeLevel(), null, 2); downloadBlob(new Blob([data], { type:'application/json;charset=utf-8' }), 'level.json'); }

function loadJSON(){
  var inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
  inp.addEventListener('change', function(){
    var f = inp.files && inp.files[0]; if(!f) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var d = JSON.parse(reader.result); if(!d || typeof d !== 'object') throw new Error('格式错误'); pushHistory();
        level.worldW = d.worldW || 4000; level.worldH = d.worldH || 540; level.playerMaxHp = d.playerMaxHp || 3; level.spawn = d.spawn || { x:60, y:458 };
        level.solids = (d.solids || []).map(function(s){ return { x:s.x, y:s.y, w:s.w, h:s.h, ow:s.w, oh:s.h, ox:s.x, oy:s.y, hitboxes: s.hitboxes || [], morph: s.morph || 'none', morphDemo: false, morphLoop: s.morphLoop !== false, targetW: s.targetW || s.w, targetH: s.targetH || s.h, targetOffX: s.targetOffX || 0, targetOffY: s.targetOffY || 0 }; });
        level.movers = (d.movers || []).map(function(m){ return { x:m.x, y:m.y, w:m.w, h:m.h, ow:m.w, oh:m.h, ox:m.x, oy:m.y, ax:m.ax||0, ay:m.ay||0, spd:m.spd||0.02, phase:m.phase||0, path: m.path || [], pathSpeed: m.pathSpeed || 2, hitboxes: m.hitboxes || [], morph: m.morph || 'none', morphDemo: false, morphLoop: m.morphLoop !== false, targetW: m.targetW || m.w, targetH: m.targetH || m.h, targetOffX: m.targetOffX || 0, targetOffY: m.targetOffY || 0 }; });
        level.spikes = d.spikes || [];
        level.adv_spikes = (d.adv_spikes || []).map(function(s){
          return { x:s.x, y:s.y, w:s.w, h:s.h, ow:s.w, oh:s.h, ox:s.x, oy:s.y, damage:s.damage, shape:s.shape, visibility:s.visibility, morph:s.morph || 'none', morphDemo: false, morphLoop:s.morphLoop !== false, layer:s.layer, targetW:s.targetW||s.w, targetH:s.targetH||s.h, targetOffX: s.targetOffX || 0, targetOffY: s.targetOffY || 0, hitboxes:s.hitboxes||[], phase:s.phase||0, path: s.path || [], pathSpeed: s.pathSpeed || 2 };
        });
        level.enemies = (d.enemies || []).map(function(e){
          var base = { type:e.type, x:e.x, y:e.y, w:e.w, h:e.h, path: e.path || [], pathSpeed: e.pathSpeed || 2, hitboxes: e.hitboxes || [], hp: e.hp || 1, damage: e.damage || 1, resetOnDeath: e.resetOnDeath !== false };
          if(e.type === 'walker'){ base.minX=e.minX; base.maxX=e.maxX; base.vx=e.vx || 1.5; }
          else { base.baseY = e.baseY !== undefined ? e.baseY : e.y; base.phase = e.phase || 0; base.cd = e.cd || 90; }
          return base;
        });
        level.checkpoints = (d.checkpoints || []).map(function(c){ return { type: c.type || 'checkpoint', x:c.x, y:c.y, w:c.w, h:c.h, spawnX: c.spawnX !== undefined ? c.spawnX : Math.round(c.x + c.w/2 - 7), spawnY: c.spawnY !== undefined ? c.spawnY : Math.round(c.y + c.h - 22) }; });
        level.goal = d.goal && d.goal.w ? d.goal : null; ed.selected = null; ed.multiSelected = []; ed.selectedHitboxIdx = undefined; ed.boxSelect = null; refreshAll(); fitView(); render();
      }catch(err){ alert('加载失败：' + err.message); }
    }; reader.readAsText(f);
  }); inp.click();
}

function init(){
  buildTools(); bindWorldInputs();
  $('closeAdvModal').addEventListener('click', function(){ ed.selected = null; ed.multiSelected = []; ed.selectedHitboxIdx = undefined; refreshInspector(); refreshObjList(); ed.dirty = true; });
  $('closeEntityModal').addEventListener('click', function(){ ed.selected = null; ed.multiSelected = []; ed.selectedHitboxIdx = undefined; refreshInspector(); refreshObjList(); ed.dirty = true; });
  $('btn-undo').addEventListener('click', doUndo); $('btn-redo').addEventListener('click', doRedo); $('btn-fit').addEventListener('click', fitView); $('btn-test').addEventListener('click', testPlay); $('btn-close-test').addEventListener('click', closeTest); $('btn-export').addEventListener('click', exportHTML); $('btn-save').addEventListener('click', saveJSON); $('btn-load').addEventListener('click', loadJSON);
  // 让测试 iframe 在点击遮罩任意位置时也能重新获得焦点
  $('test-overlay').addEventListener('mousedown', function(){
    try { $('test-frame').contentWindow.focus(); } catch(e){}
  });
  window.addEventListener('resize', function(){ resizeCanvas(); ed.dirty = true; });
  resizeCanvas(); fitView(); refreshAll();
  requestAnimationFrame(loop);
  window.__editorInited = true;
}
init();
})();
</script>
